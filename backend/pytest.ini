[pytest]
# Configurações do pytest para os testes unitários
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    asyncio: marca testes como assíncrono (pytest-asyncio)
    unit: marca testes unitários
    integration: marca testes de integração
    functional: marca testes funcionais
    e2e: marca testes end-to-end

# Configuração do asyncio
asyncio_mode = auto

# Opções de linha de comando padrão
addopts =
    -v
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Ignorar avisos específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

